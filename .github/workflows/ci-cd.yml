name: Auth Service CI/CD Pipeline

on:
  push:
    branches: [ "main", "master", "develop", "feature/**" ]
  pull_request:
    branches: [ "main", "master", "develop" ]

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: 1. Test & Quality Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - run: |
          mkdir -p ~/.m2
          echo "<settings><servers><server><id>github</id><username>${{ github.actor }}</username><password>${{ secrets.GITHUB_TOKEN }}</password></server></servers></settings>" > ~/.m2/settings.xml
      - run: ./mvnw clean test jacoco:report jacoco:check

  build:
    name: 2. Build Artifact
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - run: |
          mkdir -p ~/.m2
          echo "<settings><servers><server><id>github</id><username>${{ github.actor }}</username><password>${{ secrets.GITHUB_TOKEN }}</password></server></servers></settings>" > ~/.m2/settings.xml
      - run: ./mvnw package -DskipTests
      - uses: actions/upload-artifact@v4
        with:
          name: auth-service-jar
          path: target/auth-service-*.jar
          retention-days: 1

  package:
    name: 3. Package & Publish to Registry (GHCR)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: auth-service-jar
          path: target/
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: repo_name
        run: |
          REPO_LOWER=$(echo "${{ github.repository_owner }}/auth-service" | tr '[:upper:]' '[:lower:]')
          echo "image_repo=ghcr.io/${REPO_LOWER}" >> $GITHUB_OUTPUT
      - id: versioning
        run: |
          BRANCH_NAME=${GITHUB_REF#refs/heads/}
          if [[ "$BRANCH_NAME" == "main" || "$BRANCH_NAME" == "master" ]]; then
            echo "tag=latest" >> $GITHUB_OUTPUT
          else
            SAFE_BRANCH=$(echo $BRANCH_NAME | tr '/' '-')
            echo "tag=${SAFE_BRANCH}-SNAPSHOT" >> $GITHUB_OUTPUT
          fi
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ steps.repo_name.outputs.image_repo }}:${{ github.sha }}
            ${{ steps.repo_name.outputs.image_repo }}:${{ steps.versioning.outputs.tag }}