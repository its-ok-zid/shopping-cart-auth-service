name: Auth Service CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read
  packages: write

jobs:
  # ==========================================
  # STAGE 1: TEST
  # ==========================================
  test:
    name: 1. Test & Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Configure GitHub Packages Authentication
        run: |
          mkdir -p ~/.m2
          echo "<settings><servers><server><id>github</id><username>${{ github.actor }}</username><password>${{ secrets.GITHUB_TOKEN }}</password></server></servers></settings>" > ~/.m2/settings.xml

      - name: Run Test Suite & JaCoCo Coverage Check
        run: ./mvnw clean test jacoco:report jacoco:check

  # ==========================================
  # STAGE 2: BUILD
  # ==========================================
  build:
    name: 2. Build Artifact
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Configure GitHub Packages Authentication
        run: |
          mkdir -p ~/.m2
          echo "<settings><servers><server><id>github</id><username>${{ github.actor }}</username><password>${{ secrets.GITHUB_TOKEN }}</password></server></servers></settings>" > ~/.m2/settings.xml

      - name: Package Executable JAR
        run: ./mvnw package -DskipTests

      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: auth-service-jar
          path: target/auth-service-*.jar
          retention-days: 1

  # ==========================================
  # STAGE 3: PACKAGE
  # ==========================================
  package:
    name: 3. Package & Publish to Registry (GHCR)
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download JAR Artifact
        uses: actions/download-artifact@v4
        with:
          name: auth-service-jar
          path: target/

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Image Repository Name
        id: repo_name
        run: |
          REPO_LOWER=$(echo "${{ github.repository_owner }}/auth-service" | tr '[:upper:]' '[:lower:]')
          echo "image_repo=ghcr.io/${REPO_LOWER}" >> $GITHUB_OUTPUT

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ steps.repo_name.outputs.image_repo }}:${{ github.sha }}
            ${{ steps.repo_name.outputs.image_repo }}:latest

  # ==========================================
  # STAGE 4: DEPLOY
  # ==========================================
  deploy:
    name: 4. Deploy (Pull & Restart)
    needs: package
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: Execute Deployment
        run: |
          echo "=========================================================="
          echo "Simulating production deployment to local / server cluster"
          echo "Target Image: ghcr.io/${{ github.repository_owner }}/auth-service:latest"
          echo "Command: docker compose pull && docker compose up -d --remove-orphans"
          echo "=========================================================="